<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>츄르츕츕</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f6f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }

    .card {
      width: 90%;
      max-width: 360px;
      background: white;
      border-radius: 24px;
      padding: 32px 20px 36px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.6s ease;
      text-align: center;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }

    .restart-btn {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 999px;
      border: none;
      background: #ff8f8f;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255,143,143,0.4);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .restart-btn:active {
      transform: scale(0.94);
      box-shadow: 0 3px 8px rgba(255,143,143,0.3);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">😺 만족했어요!</div>
    <div class="subtitle">고양이가 행복해요</div>

    <button class="restart-btn" onclick="restart()">
      다시 시작하기
    </button>
  </div>

  <script>
    function restart() {
      window.location.href = 'start.html';
    }
  </script>

</body>
</html>
