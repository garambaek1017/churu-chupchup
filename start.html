<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>츄르츕츕</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f6f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }

    .card {
      width: 90%;
      max-width: 360px;
      background: white;
      border-radius: 24px;
      padding: 28px 20px 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.6s ease;
    }

    .loading-img {
      width: 100%;
      max-width: 260px;
      user-select: none;
      -webkit-user-drag: none;
    }

    .title {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #999;
    }

    .start-btn {
      margin-top: 18px;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 999px;
      border: none;
      background: #ff8f8f;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255,143,143,0.4);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .start-btn:active {
      transform: scale(0.94);
      box-shadow: 0 3px 8px rgba(255,143,143,0.3);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <img
      src="loading.png"
      alt="츄르 로딩"
      class="loading-img"
      draggable="false"
    />

    <div class="title">츄르츕츕 🐱</div>
    <div class="subtitle">고양이에게 츄르를 먹여주세요</div>

    <button class="start-btn" onclick="startGame()">START</button>
  </div>

  <script>
    function startGame() {
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
