<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양이 카드 맞추기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game">
       <div id="start-screen" class="screen start-bg"> 
    
            <button class="menu-btn start-btn" onclick="startGameRandom()">
                GAME START
            </button>
        </div>

        <div id="game-screen" class="screen hidden">
            <div id="timer-wrapper">
                <span id="timer-label">Play Time : </span>
                <span id="timer-count">0</span>초
            </div>
            <div id="game-board" class="grid-container"></div>
            <div id="start-overlay" class="hidden">START!</div>
        </div>

      <div id="end-screen" class="screen hidden">
    <div class="result-card">
        <h2 class="result-title">MISSION<br>SUCCESS!</h2>
        
        <div class="winner-img-area">
            <img src="image/end.png" alt="성공 고양이" class="winner-cat">
        </div>

        <div class="score-box">
            <p class="score-label">총 플레이 시간</p>
            <p id="final-message" class="score-number">00초</p>
        </div>

        <div class="button-group">
            <button class="menu-btn restart-btn" onclick="restartGame()">
                한 번 더 하기 ↺
            </button>
            <button class="menu-btn home-btn" onclick="goToHome()">
                처음으로
            </button>
        </div>
    </div>
</div>

    <div id="sound-box" style="display: none;">
        <audio id="bgm" src="sound/bgm.mp3" loop></audio> <audio id="s-flip" src="sound/flip.wav"></audio>
        <audio id="s-match" src="sound/match.mp3"></audio>
        <audio id="s-success" src="sound/success.mp3"></audio>
        <audio id="s-hint" src="sound/hint.wav"></audio>
    </div>


    </div> <script src="script.js"></script>
</body>
</html>
